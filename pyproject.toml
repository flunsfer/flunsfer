[project]
name = "flunsfer-api"
version = "0.1.0"
description = "FastAPI backend for flunsfer"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic[email]>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "bcrypt>=4.0,<5.0",
    "pyjwt>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.4,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]  # B008: FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
